name: Build APK via PWABuilder
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: 18 }
      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli
      - name: Build APK with Bubblewrap
        run: |
          mkdir -p apk-build
          cd apk-build
          bubblewrap init --manifest https://kilua67.github.io/clipviral-one-app/manifest.json --directory . || echo "init done"
          # Create twa-manifest.json manually if init fails
          cat > twa-manifest.json <<'JSON'
          {
            "packageId": "com.clipviral.oneapp",
            "host": "kilua67.github.io",
            "name": "ClipViral ONE APP",
            "launcherName": "ClipViral",
            "display": "standalone",
            "themeColor": "#08080a",
            "navigationColor": "#08080a",
            "backgroundColor": "#08080a",
            "enableNotifications": false,
            "startUrl": "/clipviral-one-app/",
            "iconUrl": "https://cdn-icons-png.flaticon.com/512/1384/1384060.png",
            "maskableIconUrl": "https://cdn-icons-png.flaticon.com/512/1384/1384060.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": { "path": "./android.keystore", "alias": "android" },
            "appVersion": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://kilua67.github.io/clipviral-one-app/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": { "enabled": false },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://kilua67.github.io/clipviral-one-app/",
            "minSdkVersion": 19,
            "orientation": "any"
          }
          JSON
          bubblewrap build || echo "build attempted"
          ls -la
          find . -name "*.apk" -o -name "*.aab" | head -20
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clipviral-apk
          path: |
            apk-build/app/build/outputs/**/*.apk
            apk-build/**/*.apk
            **/*.apk
