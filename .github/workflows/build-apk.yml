name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Build APK - Simple WebView
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init ClipViral com.clipviral.oneapp --web-dir=. --npm-client=npm || true
          npx cap add android || true
          npx cap copy android
          cd android
          echo "Listing android folder:"
          ls -la
          echo "Building..."
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x lint --stacktrace || echo "Gradle failed, trying alternative"
          echo "Finding APKs:"
          find . -name "*.apk" -type f | head -20
          ls -la app/build/outputs/apk/debug/ || echo "No debug folder"
      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipviral-apk-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/**/build/outputs/**/*.apk
            **/*.apk
          if-no-files-found: warn
      - name: List files for debug
        if: always()
        run: |
          find . -name "*.apk" -o -name "*.aab" | head -20
          ls -R | grep -E "\.apk|\.aab" | head -20
